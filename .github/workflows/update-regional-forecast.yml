name: Update regional race forecasts

on:
  schedule:
    - cron: '7 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-regional-race-forecast
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out race dashboard
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch and validate covered race windows
        run: node tools/update-regional.js

      - name: Publish changed forecast snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add regional.js
          if git diff --cached --quiet; then
            echo 'Forecast snapshot is unchanged.'
          else
            git commit -m 'Refresh covered MeteoGalicia race forecasts'
            git push origin HEAD:main
          fi
